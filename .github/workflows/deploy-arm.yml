name: Deploy VMSS to Azure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Debug secrets
        run: |
          if [ -z "${{ secrets.ADMIN_PASSWORD }}" ]; then
            echo "Admin Password is EMPTY"
          else
            echo "Admin Password is SET"
          fi
         
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Run linter
          echo "Linting..................... :)))"
        run: docker run --rm myapp:latest npm run lint
        
      - name: Login to Azure with Service Principal
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Deploy ARM Template
        uses: azure/arm-deploy@v1
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: arm-rg1
          template: vmss.json
          parameters: vmSku=Standard_B2s instanceCount=3 adminUsername=${{ secrets.ADMIN_USERNAME }} adminPassword=${{ secrets.ADMIN_PASSWORD }}
