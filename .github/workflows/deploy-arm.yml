name: Deploy VMSS to Azure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Debug secrets
        run: |
          if [ -z "${{ secrets.ADMIN_PASSWORD }}" ]; then
            echo "Admin Password is EMPTY"
          else
            echo "Admin Password is SET"
          fi
         
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure with Service Principal
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy ARM Template with parameters file
        uses: azure/arm-deploy@v1
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: arm-rg1
          template: vmss.json
          parameters: >
             {
              "vmSku": { "value": "Standard_DS1_v2" },
              "instanceCount": { "value": 3 },
              "adminUsername": { "value": "${{ secrets.ADMIN_USERNAME }}" },
              "adminPassword": { "value": "${{ secrets.ADMIN_PASSWORD }}" }
             }
