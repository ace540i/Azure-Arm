name: Docker Build and Test

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build --no-cache -t myapp:latest .

      - name: Run container
        run: docker run --rm myapp:latest echo "Container started"

      - name: Run inline tests
        run: |
          echo "Running inline tests..."
          docker run --rm myapp:latest npm test
          
      - name: Inspect container contents
        run: |
          echo "=== Files in /app ==="
          docker run --rm myapp:latest ls -la /app
          
          echo "=== Package.json contents ==="
          docker run --rm myapp:latest cat /app/package.json
          
          echo "=== Node version ==="
          docker run --rm myapp:latest node --version
